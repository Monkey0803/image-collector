name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The extension itself has no runtime dependencies; these versions only
        # affect the Node-based checks, so cover the oldest and a current LTS.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so the whitespace check can diff against the push base
          # or the PR base branch, not just the immediate parent
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: JavaScript syntax
        run: |
          node --check popup.js
          node --check library.js
          node --check service-worker.js

      - name: Regression tests
        run: node tests/extension-regression.test.js

      - name: Smart collection tests
        run: node --test tests/smart-collections.test.js

      - name: Image referrer rule tests
        run: node --test tests/image-referrer-rules.test.js

      - name: 3.7.0 feature behaviour tests
        run: node --test tests/feature-3.7-behavior.test.js

      - name: Packaging validation
        run: bash scripts/package-extension.sh

      - name: Packaged manifest matches the source manifest
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const version = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version;
            const inside = JSON.parse(execFileSync("unzip", ["-p", `dist/image-collector-${version}.zip`, "manifest.json"], { encoding: "utf8" })).version;
            if (inside !== version) {
              console.error(`packaged manifest version ${inside} does not match source ${version}`);
              process.exit(1);
            }
            console.log("packaged manifest version:", inside);
          '

      - name: Whitespace errors
        run: |
          # Check the full range introduced by this push/PR, not just the last
          # commit, so a multi-commit change cannot hide whitespace errors.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "checking whitespace from $BASE to HEAD"
            git diff --check "$BASE" HEAD
          else
            echo "base $BASE unavailable; checking the last commit instead"
            git diff --check HEAD~1 HEAD
          fi
